name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: web
      - name: Tipos
        run: npm run typecheck
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Pruebas y cobertura
        run: npm run test:cobertura
        working-directory: web
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
        working-directory: web
      - name: Construir
        run: npx vite build
        working-directory: web
        env:
          VITE_BASE: /data-expedition/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Publicar slides de las sesiones
        run: |
          mkdir -p web/dist/slides
          cp docs/slides/marca.css docs/slides/motor.js web/dist/slides/
          cp -r docs/slides/img web/dist/slides/img
          cp docs/slides/s*.html web/dist/slides/
          cp docs/slides/estudia.css web/dist/slides/
          cp -r docs/slides/estudia web/dist/slides/estudia
          cp docs/slides/c2av-presentacion-*.html web/dist/slides/
          cp docs/slides/c2bas-*.html web/dist/slides/
          cp docs/slides/c2int-*.html web/dist/slides/
          cp docs/slides/instalacion-herramientas*.html web/dist/slides/
          cp docs/slides/bigquery-conexion.html web/dist/slides/
          cp docs/slides/index.html web/dist/slides/
          cp docs/slides/c2av-clinica-git.html web/dist/slides/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
